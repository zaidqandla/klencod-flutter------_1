}

class _SchoolAppScreenState extends State<SchoolAppScreen> {
  late final WebViewController controller;

  @override
  void initState() {
    super.initState();
    // إذا قمت برفع الموقع على رابط، ضع الرابط هنا. أو يمكنك تحميله محلياً.
    controller = WebViewController()
      ..setJavaScriptMode(JavaScriptMode.unrestricted)
      ..loadRequest(Uri.parse('https://yourusername.github.io/school-system/')); // ضع رابط موقعك المدرسي هنا
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('ثانوية أم الربيعين - نظام الإدارة'),
        backgroundColor: Colors.indigo,
        centerTitle: true,
      ),
      body: WebViewWidget(controller: controller),
    );
  }
}
