    <script>
        // LOCAL STORAGE DATABASE INIT
        const DB_KEY = 'EDUMASTER_ZERO_DATA_DB_2026';

        function loadDB() {
            const raw = localStorage.getItem(DB_KEY);
            if (!raw) {
                return {
                    users: [],
                    lessons: [],
                    assignments: [],
                    submissions: [],
                    grades: [],
                    attendance: [],
                    behavior: [],
                    announcements: [],
                    parentMessages: []
                };
            }
            return JSON.parse(raw);
        }

        function saveDB(dbData) {
            localStorage.setItem(DB_KEY, JSON.stringify(dbData));
        }

        let db = loadDB();
        let currentUser = null;
        let activeTab = 'dashboard';
        let chartInstance = null;

        const navItems = [
            { id: 'dashboard', name: 'لوحة التحكم والمؤشرات', icon: 'fa-chart-pie', roles: ['principal', 'vice_principal', 'teacher', 'student'] },
            { id: 'users', name: 'إدارة الكادر والطلاب', icon: 'fa-users-gear', roles: ['principal', 'vice_principal'] },
            { id: 'lessons', name: 'الدروس والجدول', icon: 'fa-book-open', roles: ['principal', 'vice_principal', 'teacher', 'student'] },
            { id: 'assignments', name: 'الواجبات والتكليفات', icon: 'fa-tasks', roles: ['principal', 'vice_principal', 'teacher', 'student'] },
            { id: 'grades', name: 'دفتر الدرجات والنتائج', icon: 'fa-award', roles: ['principal', 'vice_principal', 'teacher', 'student'] },
            { id: 'attendance', name: 'رصد الحضور والغياب', icon: 'fa-clipboard-user', roles: ['principal', 'vice_principal', 'teacher'] },
            { id: 'behavior', name: 'سجل السلوك والانضباط', icon: 'fa-shield-heart', roles: ['principal', 'vice_principal', 'teacher'] },
            { id: 'parent_messages', name: 'إشعارات أولياء الأمور', icon: 'fa-paper-plane', roles: ['principal', 'vice_principal', 'teacher'] },
            { id: 'announcements', name: 'التعاميم والإعلانات', icon: 'fa-bullhorn', roles: ['principal', 'vice_principal', 'teacher', 'student'] },
            { id: 'system_settings', name: 'إعدادات النظام والأمان', icon: 'fa-sliders', roles: ['principal'] }
        ];

        window.onload = function() {
            checkInitialSetupState();
        };

        function checkInitialSetupState() {
            const hasPrincipal = db.users.some(u => u.role === 'principal');
            const setupWizardBox = document.getElementById('setupWizardBox');
            const normalLoginBox = document.getElementById('normalLoginBox');
            const subtitle = document.getElementById('loginSubtitle');

            if (!hasPrincipal) {
                setupWizardBox.classList.remove('hidden');
                normalLoginBox.classList.add('hidden');
                subtitle.innerText = 'إعداد النظام لأول مرة - تفعيل حساب المدير';
            } else {
                setupWizardBox.classList.add('hidden');
                normalLoginBox.classList.remove('hidden');
                subtitle.innerText = 'بوابة الدخول الآمنة إلى نظام المدرسة';
            }
        }

        function handleInitialSetup(e) {
            e.preventDefault();
            const name = document.getElementById('initAdminName').value.trim();
            const username = document.getElementById('initAdminUsername').value.trim();
            const password = document.getElementById('initAdminPassword').value.trim();

            const adminUser = {
                id: 'USR-' + Date.now(),
                name: name,
                username: username,
                password: password,
                role: 'principal',
                roleTitle: 'المدير العام (صلاحيات كاملة)'
            };

            db.users.push(adminUser);
            saveDB(db);

            currentUser = adminUser;
            loginSuccess();
            showToast('تم إنشاء حساب المدير وتفعيل النظام بنجاح!');
        }

